<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bgGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#1e3920"/>
      <stop offset="100%" stop-color="#090f0a"/>
    </radialGradient>
    <radialGradient id="ballGrad" cx="36%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e8f55a"/>
      <stop offset="60%" stop-color="#cce030"/>
      <stop offset="100%" stop-color="#a8b820"/>
    </radialGradient>
    <radialGradient id="ballShine" cx="38%" cy="28%" r="40%">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ballShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="ballClip">
      <circle cx="250" cy="205" r="112"/>
    </clipPath>
  </defs>

  <!-- Outer background circle -->
  <circle cx="250" cy="250" r="246" fill="url(#bgGrad)"/>

  <!-- Gold outer ring -->
  <circle cx="250" cy="250" r="244" fill="none" stroke="#c9a84c" stroke-width="4.5" opacity="0.9"/>
  <!-- Faint inner ring -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.2"/>

  <!-- Tennis ball with shadow -->
  <circle cx="250" cy="205" r="112" fill="url(#ballGrad)" filter="url(#ballShadow)"/>

  <!-- Tennis ball seams clipped to ball -->
  <g clip-path="url(#ballClip)">
    <!-- Top seam arch -->
    <path d="M 152 168 C 192 100 308 100 348 168"
          fill="none" stroke="white" stroke-width="9" stroke-linecap="round" opacity="0.65"/>
    <!-- Bottom seam arch -->
    <path d="M 152 242 C 192 310 308 310 348 242"
          fill="none" stroke="white" stroke-width="9" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- Ball surface shine -->
  <circle cx="250" cy="205" r="112" fill="url(#ballShine)"/>

  <!-- Analytics trend line — rising from lower-left to upper-right -->
  <g filter="url(#goldGlow)" clip-path="url(#ballClip)">
    <polyline
      points="168,248  194,222  216,235  242,196  268,210  296,178  328,155"
      fill="none" stroke="#c9a84c" stroke-width="5.5"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Data point dots on the line -->
  <g filter="url(#goldGlow)">
    <circle cx="168" cy="248" r="5"   fill="#c9a84c"/>
    <circle cx="194" cy="222" r="5"   fill="#c9a84c"/>
    <circle cx="216" cy="235" r="5"   fill="#c9a84c"/>
    <circle cx="242" cy="196" r="5"   fill="#c9a84c"/>
    <circle cx="268" cy="210" r="5"   fill="#c9a84c"/>
    <circle cx="296" cy="178" r="5"   fill="#c9a84c"/>
    <!-- Final point — slightly larger, brightest -->
    <circle cx="328" cy="155" r="7.5" fill="#e0c060"/>
  </g>

  <!-- Wordmark -->
  <text x="250" y="366"
        font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif"
        font-size="42" font-weight="bold"
        fill="#f0ead6" text-anchor="middle" letter-spacing="5">TENNIS</text>

  <text x="250" y="406"
        font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif"
        font-size="22" font-weight="normal"
        fill="#c9a84c" text-anchor="middle" letter-spacing="12">ANALYST</text>

  <!-- Decorative rule under wordmark -->
  <line x1="155" y1="422" x2="345" y2="422"
        stroke="#c9a84c" stroke-width="1" opacity="0.4"/>

  <!-- Small diamond ornaments on rule -->
  <polygon points="250,416  255,422  250,428  245,422"
           fill="#c9a84c" opacity="0.55"/>
</svg>
