<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Analyst — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#22c55e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tennis">
    <link rel="apple-touch-icon" href="/icon.svg">
</head>
<body>

    <div class="auth-screen">
        <div class="geo-bg" aria-hidden="true">
            <div class="geo geo-1"></div>
            <div class="geo geo-2"></div>
            <div class="geo geo-3"></div>
            <div class="geo geo-4"></div>
            <div class="geo geo-5"></div>
        </div>
        <div class="auth-card">
            <div class="auth-badge">🎾 Premium Member Access</div>
            <div class="auth-logo">Tennis Analyst</div>
            <p class="auth-sub">Track your matches. Improve your game.</p>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login"    onclick="showTab('login')">Log In</button>
                <button class="auth-tab"        id="tab-register" onclick="showTab('register')">Register</button>
            </div>

            <!-- Login -->
            <form id="form-login" class="auth-form" onsubmit="handleLogin(event)">
                <div class="auth-field">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="your@email.com" required>
                </div>
                <div class="auth-field">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <p class="auth-error" id="login-error"></p>
                <button type="submit" class="start-btn">Log In</button>
            </form>

            <!-- Register -->
            <form id="form-register" class="auth-form" style="display:none" onsubmit="handleRegister(event)">
                <div class="auth-field">
                    <label>Username</label>
                    <input type="text" id="reg-username" placeholder="Your name" maxlength="20" required>
                </div>
                <div class="auth-field">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="your@email.com" required>
                </div>
                <div class="auth-field">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="At least 6 characters" required>
                </div>
                <p class="auth-error"   id="reg-error"></p>
                <p class="auth-success" id="reg-success"></p>
                <button type="submit" class="start-btn">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        function showTab(tab) {
            document.getElementById('form-login').style.display    = tab === 'login'    ? 'flex' : 'none';
            document.getElementById('form-register').style.display = tab === 'register' ? 'flex' : 'none';
            document.getElementById('tab-login').classList.toggle('active',    tab === 'login');
            document.getElementById('tab-register').classList.toggle('active', tab === 'register');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const errEl = document.getElementById('login-error');
            errEl.textContent = '';
            const res  = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email:    document.getElementById('login-email').value,
                    password: document.getElementById('login-password').value,
                }),
            });
            const data = await res.json();
            if (res.ok) { window.location.href = '/home'; }
            else        { errEl.textContent = data.error; }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const errEl = document.getElementById('reg-error');
            const sucEl = document.getElementById('reg-success');
            errEl.textContent = '';
            sucEl.textContent = '';
            const res  = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('reg-username').value,
                    email:    document.getElementById('reg-email').value,
                    password: document.getElementById('reg-password').value,
                }),
            });
            const data = await res.json();
            if (res.ok) {
                sucEl.textContent = 'Account created! You can now log in.';
                showTab('login');
            } else {
                errEl.textContent = data.error;
            }
        }
    </script>
</body>
</html>
